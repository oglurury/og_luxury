<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#28133b 0%,#100a18 42%,#050407 100%);text-align:center}
header{padding:32px 15px 20px}
.logo{font-size:clamp(32px,7vw,48px);font-weight:900;letter-spacing:6px;background:linear-gradient(110deg,#fff,#c9a5ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}

.contact{margin-top:40px}
.button{display:inline-block;padding:14px 23px;border:1px solid #a77ad2;border-radius:30px;color:#fff!important;text-decoration:none!important;font-size:11px;font-weight:bold;letter-spacing:1px;transition:all .25s ease}
.button:link,.button:visited,.button:hover,.button:active{color:#fff!important;text-decoration:none!important}
.button:hover{background:#7538a3;box-shadow:0 0 20px #a855f750}
footer{padding:25px 12px 30px;border-top:1px solid #ffffff12;color:#82778d;font-size:10px;letter-spacing:2px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.brand{min-height:100px;font-size:13px}}
</style>
</head>
