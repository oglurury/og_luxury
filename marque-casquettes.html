<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGLUXE | Casquettes</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#211033 0%,#09070d 55%,#050407 100%);color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:28px 15px 12px}
.logo{font-size:clamp(28px,7vw,45px);font-weight:900;letter-spacing:5px;background:linear-gradient(110deg,#fff,#c9a5ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:#bda5d9;font-size:11px;letter-spacing:4px;margin-top:9px}
main{width:min(900px,92%);margin:35px auto;padding-bottom:45px}
h1{font-size:clamp(22px,5vw,34px);letter-spacing:3px;margin-bottom:12px}
.description{color:#c9bfd3;font-size:14px;line-height:1.7}
.status{margin:55px auto 35px;padding:32px 18px;max-width:540px;border:1px solid #6f4294;border-radius:18px;background:linear-gradient(145deg,#1c1028,#0d0a12);box-shadow:0 0 30px #8d40ce18}
.status .symbol{font-size:35px;color:#c79aff}
.status h2{font-size:17px;letter-spacing:3px;margin:18px 0 12px}
.status p{color:#bdb1c9;font-size:13px;line-height:1.7}
a{color:inherit;text-decoration:none}
.button{display:inline-block;margin:10px 5px;padding:13px 20px;border:1px solid #a77ad2;border-radius:30px;font-size:11px;font-weight:bold;letter-spacing:1px;transition:.2s}
.button:hover{background:#8a43ba;box-shadow:0 0 20px #a855f7}
footer{padding:25px 10px 30px;border-top:1px solid #ffffff12;color:#82778d;font-size:10px;letter-spacing:2px}
</style>
</head>
<body>
<header>
<div class="logo">OGLUXE</div>
<div class="subtitle">COLLECTIONS HOMME</div>
</header>
<main>
<h1 id="brand">CASQUETTES</h1>
<p class="description">Découvrez notre sélection et notre univers.</p>
<section class="status">
<div class="symbol">✦</div>
<h2>COLLECTION EN PRÉPARATION</h2>
<p>Cette sélection arrive prochainement.<br>Contactez-nous sur Telegram pour toute demande de disponibilité.</p>
<a class="button" href="https://t.me/og_luxury">CONTACT TELEGRAM</a>
</section>
<a class="button" href="casquettes.html">← RETOUR AUX CASQUETTES</a>
</main>
<footer>OGLUXE · COLLECTIONS HOMME</footer>
<script>
const params=new URLSearchParams(window.location.search);
const marque=params.get("marque");
if(marque){
document.getElementById("brand").textContent=marque.replace(/[-_]/g," ").toUpperCase();
document.title="OGLUXE | "+document.getElementById("brand").textContent;
}
</script>
</body>
</html>
