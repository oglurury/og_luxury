<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vêtements | OG LUXURY</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at top, #28103e 0%, #100b17 42%, #050507 100%);
    }

    header {
      text-align: center;
      padding: 38px 16px 24px;
    }

    .back {
      display: inline-block;
      color: #d9baff;
      text-decoration: none;
      border: 1px solid #7443a5;
      border-radius: 30px;
      padding: 10px 16px;
      font-size: 13px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 54px);
      letter-spacing: 5px;
      color: #f4eaff;
      text-shadow: 0 0 22px #a34dff;
    }

    .subtitle {
      color: #bdaacb;
      font-size: 13px;
      letter-spacing: 3px;
      margin-top: 12px;
    }

    main {
      width: min(100% - 28px, 900px);
      margin: 20px auto 50px;
    }

    .brands {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .brand {
      min-height: 112px;
      padding: 16px 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(190, 126, 255, .32);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(48, 25, 65, .75), rgba(10, 9, 15, .94));
      box-shadow: inset 0 0 18px rgba(151, 69, 222, .06);
      transition: .25s ease;
    }

    .brand span {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(14px, 3.4vw, 20px);
      font-weight: bold;
      letter-spacing: 1.5px;
      overflow-wrap: anywhere;
      color: #f5efff;
      text-shadow: 0 0 12px rgba(190, 126, 255, .3);
    }

    .brand:hover {
      border-color: #d8a9ff;
      box-shadow: 0 0 22px rgba(164, 74, 255, .22);
      transform: translateY(-3px);
    }

    .contact {
      text-align: center;
      margin: 38px 0 20px;
    }

    .contact a {
      display: inline-block;
      padding: 13px 22px;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #6927a6, #a34dff);
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #887c94;
      font-size: 12px;
      border-top: 1px solid rgba(190, 126, 255, .15);
    }

    @media (min-width: 600px) {
      .brands { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (min-width: 850px) {
      .brands { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <a class="back" href="index.html">← RETOUR À L’ACCUEIL</a>
    <h1>VÊTEMENTS</h1>
    <div class="subtitle">OG LUXURY · COLLECTIONS HOMME</div>
  </header>

  <main>
    <section class="brands" aria-label="Marques de vêtements">
      <div class="brand"><span>LOUIS VUITTON</span></div>
      <div class="brand"><span>GUCCI</span></div>
      <div class="brand"><span>DIOR</span></div>
      <div class="brand"><span>PRADA</span></div>
      <div class="brand"><span>STONE ISLAND × C.P. COMPANY</span></div>
      <div class="brand"><span>MONCLER</span></div>
      <div class="brand"><span>BURBERRY</span></div>
      <div class="brand"><span>ACNE STUDIOS</span></div>
      <div class="brand"><span>FENDI</span></div>
      <div class="brand"><span>BALENCIAGA</span></div>
      <div class="brand"><span>CHROME HEARTS</span></div>
      <div class="brand"><span>LOEWE</span></div>
    </section>

    <div class="contact">
      <a href="https://t.me/og_luxury" target="_blank" rel="noopener">
        CONTACT TELEGRAM
      </a>
    </div>
  </main>

  <footer>OG LUXURY · Collections homme</footer>
</body>
</html>
