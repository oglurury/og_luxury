<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Vêtements | OG LUXURY</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:white;font-family:Arial,sans-serif;background:radial-gradient(ellipse at top,#281039,#100b16 48%,#050507)}
header{text-align:center;padding:32px 15px 24px}
.back{display:inline-block;padding:10px 16px;margin-bottom:25px;border:1px solid #8c4bc0;border-radius:30px;color:#e7caff;text-decoration:none;font-size:13px}
h1{margin:0;font-size:clamp(30px,8vw,52px);letter-spacing:5px;text-shadow:0 0 22px #9d42ff}
.subtitle{margin-top:12px;color:#b9a6c8;font-size:12px;letter-spacing:3px}
main{width:min(920px,calc(100% - 28px));margin:20px auto 45px}
.brands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.brand{min-height:105px;padding:16px 10px;display:flex;justify-content:center;align-items:center;text-align:center;border:1px solid #be7eff55;border-radius:14px;background:linear-gradient(145deg,#21152d,#0b0a10);font-family:Georgia,serif;font-size:16px;font-weight:bold;letter-spacing:1px;transition:.25s}
.brand:hover{transform:translateY(-3px);border-color:#d7a7ff;box-shadow:0 0 22px #8b36c533}
.contact{text-align:center;margin:35px 0}
.contact a{display:inline-block;padding:14px 24px;border-radius:30px;background:linear-gradient(90deg,#6827a0,#a34dff);color:white;text-decoration:none;font-weight:bold;font-size:13px}
footer{padding:20px;text-align:center;border-top:1px solid #ffffff15;color:#92849d;font-size:12px}
@media(min-width:600px){.brands{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:850px){.brands{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
