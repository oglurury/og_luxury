<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vêtements | OG LUXURY</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at top,#281039,#100b16 48%,#050507);
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  text-align:center;
  padding:32px 15px 24px;
}

.back{
  display:inline-block;
  padding:10px 16px;
  margin-bottom:25px;
  border:1px solid #8c4bc0;
  border-radius:30px;
  color:#e7caff;
  text-decoration:none;
  font-size:13px;
}

h1{
  margin:0;
  font-size:clamp(30px,8vw,52px);
  letter-spacing:5px;
  color:#f5eaff;
  text-shadow:0 0 22px #9d42ff;
}

.subtitle{
  margin-top:12px;
  color:#b9a6c8;
  font-size:12px;
  letter-spacing:3px;
}

main{
  width:min(920px,calc(100% - 28px));
  margin:20px auto 45px;
}

.brands{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.brand{
  min-height:135px;
  padding:18px 10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:15px;
  border:1px solid rgba(190,126,255,.35);
  border-radius:14px;
  background:linear-gradient(145deg,#21152d,#0b0a10);
  transition:transform .25s,border-color .25s,box-shadow .25s;
}

.brand:hover{
  transform:translateY(-3px);
  border-color:#d7a7ff;
  box-shadow:0 0 22px #8b36c533;
}

.brand img{
  display:block;
  width:100%;
  max-width:155px;
  height:55px;
  object-fit:contain;
  filter:brightness(0) invert(1);
}

.brand p{
  margin:0;
  text-align:center;
  color:#cbb6dc;
  font-size:11px;
  letter-spacing:1.5px;
}

.contact{
  text-align:center;
  margin:35px 0;
}

.contact a{
  display:inline-block;
  padding:14px 24px;
  border-radius:30px;
  background:linear-gradient(90deg,#6827a0,#a34dff);
  color:white;
  text-decoration:none;
  font-weight:bold;
  font-size:13px;
  letter-spacing:1px;
}

footer{
  padding:20px;
  text-align:center;
  border-top:1px solid #ffffff15;
  color:#92849d;
  font-size:12px;
}

@media(min-width:600px){
  .brands{grid-template-columns:repeat(3,minmax(0,1fr))}
}

@media(min-width:850px){
  .brands{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>

<body>
<header>
  <a class="back" href="index.html">← RETOUR À L’ACCUEIL</a>
  <h1>VÊTEMENTS</h1>
  <div class="subtitle">OG LUXURY · COLLECTIONS HOMME</div>
</header>

<main>
<section class="brands" aria-label="Logos des marques">

  <article class="brand">

         alt="Logo Louis Vuitton" loading="lazy">

  </article>

  <article class="brand">
    <img src="https://cdn.simpleicons.org/prada/ffffff"
         alt="Logo Prada" loading="lazy">
    <p>PRADA</p>
  </article>

  <article class="brand">
    <img src="https://cdn.simpleicons.org/stoneisland/ffffff"
         alt="Logo Stone Island" loading="lazy">

  </article>

  <article class="brand">
    <img src="https://cdn.simpleicons.org/moncler/ffffff"

  <article class="brand">
    <img src="https://cdn.simpleicons.org/burberry/ffffff"

  <article class="brand">

</body>
</html>
