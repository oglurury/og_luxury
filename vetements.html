<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08060d">
<title>Vêtements | OG LUXURY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#21102f 0%,#09070d 48%,#030304 100%);color:#f7f3fb;font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{text-align:center;padding:30px 16px 18px}
.back{display:inline-block;color:#d8b9ff;text-decoration:none;border:1px solid #7950a5;border-radius:30px;padding:10px 17px;font-size:12px;letter-spacing:1px}
.logo{font-size:clamp(32px,8vw,54px);font-weight:900;letter-spacing:5px;margin:30px 0 8px;background:linear-gradient(110deg,#fff,#aaa4b5,#fff,#8065a5);background-clip:text;-webkit-background-clip:text;color:transparent}
.subtitle{color:#b9a9c9;font-size:11px;letter-spacing:4px}
h1{text-align:center;font-size:13px;letter-spacing:5px;color:#d7b9ff;margin:38px 0 24px}
.grid{max-width:1000px;margin:auto;padding:0 16px 45px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{min-height:145px;border:1px solid #392648;border-radius:13px;background:linear-gradient(145deg,#17131c,#09080c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:18px 8px;text-align:center;box-shadow:inset 0 0 22px #a855f70a;transition:.25s}
.card:active{border-color:#bd83ff;box-shadow:0 0 20px #a855f733}
.card img{width:100%;max-width:145px;height:65px;object-fit:contain;filter:grayscale(1) brightness(1.8)}
.card span{font-size:12px;font-weight:bold;letter-spacing:1.5px;color:#eee}
footer{text-align:center;padding:22px;color:#81768c;font-size:10px;letter-spacing:2px;border-top:1px solid #24192d}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{min-height:170px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<a class="back" href="index.html">← RETOUR À L’ACCUEIL</a>
<div class="logo">OG LUXURY</div>
<div class="subtitle">L’UNIVERS DU LUXE</div>
</header>
<h1>COLLECTION VÊTEMENTS</h1>
<main class="grid" id="brands"></main>
<footer>OG LUXURY · COLLECTIONS HOMME</footer>
<script>
const brands = [
"Louis Vuitton","Gucci","Dior","Prada","Stone Island x C.P. Company",
"Moncler","Burberry","Acne Studios","Fendi","Balenciaga","Chrome Hearts","Loewe"
];
const grid = document.getElementById("brands");
brands.forEach(name => {
  const card = document.createElement("div");
  card.className = "card";
  const img = document.createElement("img");
  img.alt = "Logo " + name;
  img.loading = "lazy";
  img.src = "https://logo.clearbit.com/" + ({
    "Louis Vuitton":"louisvuitton.com",
    "Gucci":"gucci.com",
    "Dior":"dior.com",
    "Prada":"prada.com",
    "Stone Island x C.P. Company":"stoneisland.com",
    "Moncler":"moncler.com",
    "Burberry":"burberry.com",
    "Acne Studios":"acnestudios.com",
    "Fendi":"fendi.com",
    "Balenciaga":"balenciaga.com",
    "Chrome Hearts":"chromehearts.com",
    "Loewe":"loewe.com"
  }[name]);
  img.onerror = () => { img.style.display = "none"; };
  const label = document.createElement("span");
  label.textContent = name.toUpperCase();
  card.append(img,label);
  grid.appendChild(card);
});
</script>
</body>
</html>
